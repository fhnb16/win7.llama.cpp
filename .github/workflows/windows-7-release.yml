name: Windows 7 release

on:
  push:
    branches:
      - master
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-7-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Find latest stable llama.cpp release
        id: upstream
        shell: pwsh
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/ggml-org/llama.cpp/releases/latest" `
            -Headers $headers

          if ($release.tag_name -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$') {
            throw "The latest llama.cpp release has an invalid tag."
          }

          "tag=$($release.tag_name)" >> $env:GITHUB_OUTPUT

      - name: Skip an already published version
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          $tag = $env:UPSTREAM_TAG
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"

          try {
            Invoke-RestMethod -Uri $uri -Headers $headers | Out-Null
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag already exists; skipping."
          }
          catch {
            $statusCode = [int]$_.Exception.Response.StatusCode
            if ($statusCode -ne 404) {
              throw
            }
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Check out upstream release sources
        if: steps.existing.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ steps.upstream.outputs.tag }}
          path: llama.cpp
          persist-credentials: false

      - name: Patch cpp-httplib for Windows 7
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $headerPath = "llama.cpp\vendor\cpp-httplib\httplib.h"
          $sourcePath = "llama.cpp\vendor\cpp-httplib\httplib.cpp"
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          $header = [System.IO.File]::ReadAllText($headerPath).Replace("`r`n", "`n")
          $source = [System.IO.File]::ReadAllText($sourcePath).Replace("`r`n", "`n")

          $versionGuard = '(?m)^#ifdef _WIN32\n#if defined\(_WIN32_WINNT\) && _WIN32_WINNT < 0x0A00\n#error[ \t]*\\\n[ \t]*"cpp-httplib doesn''t support Windows 8 or lower\. Please use Windows 10 or later\."\n#endif\n#endif\n?'
          if ([regex]::Matches($header, $versionGuard).Count -ne 1) {
            throw "Could not uniquely locate cpp-httplib's Windows 10 minimum-version guard."
          }
          $header = [regex]::Replace($header, $versionGuard, "")

          $replacements = @(
            @{
              Prefix = "      "
              Old = @'
                ::CreateFile2(wpath.c_str(), GENERIC_READ,
                              FILE_SHARE_READ | FILE_SHARE_WRITE, OPEN_EXISTING, NULL);
          '@.Trim()
              New = @'
                ::CreateFileW(wpath.c_str(), GENERIC_READ,
                              FILE_SHARE_READ | FILE_SHARE_WRITE, NULL, OPEN_EXISTING,
                              FILE_ATTRIBUTE_NORMAL, NULL);
          '@.Trim()
            },
            @{
              Prefix = "      "
              Old = @'
                ::CreateFileMappingFromApp(hFile_, NULL, PAGE_READONLY, size_, NULL);
          '@.Trim()
              New = @'
                ::CreateFileMappingW(hFile_, NULL, PAGE_READONLY,
                                     static_cast<DWORD>(size_ >> 32),
                                     static_cast<DWORD>(size_ & 0xFFFFFFFF), NULL);
          '@.Trim()
            },
            @{
              Prefix = "  addr_ = "
              Old = "::MapViewOfFileFromApp(hMapping_, FILE_MAP_READ, 0, 0);"
              New = "::MapViewOfFile(hMapping_, FILE_MAP_READ, 0, 0, 0);"
            }
          )

          foreach ($replacement in $replacements) {
            $old = $replacement.Prefix + $replacement.Old
            $new = $replacement.Prefix + $replacement.New
            if ([regex]::Matches($source, [regex]::Escape($old)).Count -ne 1) {
              throw "Could not uniquely locate a cpp-httplib Windows 8+ file API call."
            }
            $source = $source.Replace($old, $new)
          }

          if ($header -match 'cpp-httplib doesn''t support Windows 8 or lower' -or
              $source -match 'CreateFile2|CreateFileMappingFromApp|MapViewOfFileFromApp') {
            throw "The cpp-httplib Windows 7 compatibility patch was incomplete."
          }

          [System.IO.File]::WriteAllText($headerPath, $header, $utf8NoBom)
          [System.IO.File]::WriteAllText($sourcePath, $source, $utf8NoBom)

      - name: Install portable w64devkit
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/skeeto/w64devkit/releases/latest" `
            -Headers $headers
          $asset = $release.assets |
            Where-Object { $_.name -match '^w64devkit-x64-.*\.7z\.exe$' } |
            Select-Object -First 1

          if ($null -eq $asset) {
            throw "No x64 self-extracting w64devkit archive was found."
          }

          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          $kitRoot = Join-Path $env:RUNNER_TEMP "w64devkit"
          $downloaded = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Invoke-WebRequest `
                -Uri $asset.browser_download_url `
                -OutFile $archive `
                -TimeoutSec 120 `
                -ErrorAction Stop | Out-Null

              $actualDigest = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($asset.digest -and $asset.digest -ne "sha256:$actualDigest") {
                throw "Downloaded w64devkit archive did not match the release SHA-256 digest."
              }

              $signature = [System.IO.File]::ReadAllBytes($archive)
              if ($signature.Length -lt 2 -or $signature[0] -ne 0x4D -or $signature[1] -ne 0x5A) {
                throw "Downloaded w64devkit asset is not a Windows self-extracting archive."
              }

              $downloaded = $true
              break
            }
            catch {
              Remove-Item -Path $archive -Force -ErrorAction SilentlyContinue
              if ($attempt -eq 5) {
                throw "Failed to download and verify w64devkit after $attempt attempts: $($_.Exception.Message)"
              }

              $delay = [Math]::Min(30, [Math]::Pow(2, $attempt))
              Write-Warning "w64devkit download attempt $attempt failed. Retrying in $delay seconds."
              Start-Sleep -Seconds $delay
            }
          }
          if (-not $downloaded) {
            throw "Failed to download w64devkit."
          }

          $sevenZipCommand = Get-Command 7z.exe -ErrorAction SilentlyContinue
          if ($null -ne $sevenZipCommand) {
            $sevenZipPath = $sevenZipCommand.Source
          } else {
            $sevenZipPath = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          }
          if (-not (Test-Path $sevenZipPath)) {
            throw "7z.exe was not found on the Windows runner."
          }

          & $sevenZipPath x $archive "-o$kitRoot" -y
          $extractExitCode = $LASTEXITCODE
          if ($null -eq $extractExitCode -or $extractExitCode -ne 0) {
            throw "w64devkit extraction failed with exit code $extractExitCode."
          }

          $gcc = Get-ChildItem -Path $kitRoot -Filter gcc.exe -Recurse |
            Select-Object -First 1
          if ($null -eq $gcc) {
            throw "gcc.exe was not found in the extracted w64devkit archive."
          }

          $bin = $gcc.Directory.FullName
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          "W64DEVKIT_BIN=$bin" >> $env:GITHUB_ENV

      - name: Configure Win7 CPU build
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $win7Flags = "-D_WIN32_WINNT=0x0601 -DWINVER=0x0601"
          cmake -S llama.cpp -B build -G Ninja `
            "-DCMAKE_C_COMPILER=$env:W64DEVKIT_BIN\gcc.exe" `
            "-DCMAKE_CXX_COMPILER=$env:W64DEVKIT_BIN\g++.exe" `
            -DCMAKE_BUILD_TYPE=Release `
            -DLLAMA_BUILD_IS_DEV=OFF `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_TOOLS=ON `
            -DLLAMA_OPENSSL=OFF `
            -DBUILD_SHARED_LIBS=OFF `
            -DGGML_NATIVE=OFF `
            -DGGML_OPENMP=OFF `
            "-DCMAKE_C_FLAGS=$win7Flags" `
            "-DCMAKE_CXX_FLAGS=$win7Flags" `
            "-DCMAKE_EXE_LINKER_FLAGS=-static -static-libgcc -static-libstdc++"
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed with exit code $LASTEXITCODE."
          }

      - name: Build llama.cpp
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          cmake --build build --parallel 2
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed with exit code $LASTEXITCODE."
          }

      - name: Package portable Win7 ZIP
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          $dist = Join-Path $env:RUNNER_TEMP "llama-win7"
          New-Item -ItemType Directory -Path $dist | Out-Null

          $executables = Get-ChildItem -Path "build\bin" -File |
            Where-Object { $_.Extension -in @(".exe", ".dll") }
          if (-not ($executables | Where-Object { $_.Name -eq "llama-cli.exe" })) {
            throw "llama-cli.exe was not produced."
          }
          if (-not ($executables | Where-Object { $_.Name -eq "llama-server.exe" })) {
            throw "llama-server.exe was not produced."
          }
          $executables | Copy-Item -Destination $dist

          $readme = @"
          llama.cpp $env:RELEASE_TAG - Windows 7 x64 (CPU)

          This portable build targets Windows 7 using MinGW-w64/w64devkit.
          On Windows 7, pass --no-mmap when running inference:

            llama-cli.exe -m model.gguf --no-mmap -p "Hello"
            llama-server.exe -m model.gguf --no-mmap

          This package contains the built executables and required runtime DLLs,
          if any. It does not include model files.
          "@
          Set-Content -Path (Join-Path $dist "README.txt") -Value $readme -Encoding utf8
          Copy-Item -Path "llama.cpp\LICENSE" -Destination $dist

          $zip = "llama.cpp-$env:RELEASE_TAG-win7-x64.zip"
          Compress-Archive -Path "$dist\*" -DestinationPath $zip -CompressionLevel Optimal

      - name: Verify Win7 API imports
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $executables = Get-ChildItem -Path "build\bin" -Filter "*.exe" -File
          foreach ($executable in $executables) {
            $imports = & "$env:W64DEVKIT_BIN\objdump.exe" -p $executable.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Could not inspect imports in $($executable.Name)."
            }

            $unsupported = $imports | Select-String `
              -Pattern '\b(CreateFile2|CreateFileMappingFromApp|MapViewOfFileFromApp|SetThreadDescription)\b'
            if ($unsupported) {
              throw "$($executable.Name) imports APIs unavailable on Windows 7: $unsupported"
            }
          }

      - name: Publish release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.upstream.outputs.tag }}
          name: llama.cpp ${{ steps.upstream.outputs.tag }} (Windows 7)
          body: |
            Portable x64 CPU build of upstream llama.cpp ${{ steps.upstream.outputs.tag }} for Windows 7.

            Run `llama-cli.exe` or `llama-server.exe` with `--no-mmap` on Windows 7.
          files: llama.cpp-${{ steps.upstream.outputs.tag }}-win7-x64.zip
          fail_on_unmatched_files: true
          overwrite_files: true
