name: Windows 7 release

on:
  push:
    branches:
      - master
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-7-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Select latest unbuilt llama.cpp release
        id: upstream
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releases = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=100" `
            -Headers $headers
          $publishedReleases = $releases |
            Where-Object { -not $_.draft -and $_.published_at } |
            Sort-Object { [DateTimeOffset]$_.published_at } -Descending
          $stable = $publishedReleases |
            Where-Object { -not $_.prerelease } |
            Select-Object -First 1
          $latestPrerelease = $publishedReleases |
            Where-Object { $_.prerelease } |
            Select-Object -First 1

          if ($null -eq $stable -and $null -eq $latestPrerelease) {
            throw "No published llama.cpp releases were found."
          }

          $targetHeaders = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          function Test-TargetReleaseExists {
            param([string]$Tag)

            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$Tag"
            try {
              Invoke-RestMethod -Uri $uri -Headers $targetHeaders | Out-Null
              return $true
            }
            catch {
              $statusCode = [int]$_.Exception.Response.StatusCode
              if ($statusCode -eq 404) {
                return $false
              }
              throw
            }
          }

          if ($null -ne $stable -and -not (Test-TargetReleaseExists $stable.tag_name)) {
            $selected = $stable
            $alreadyPublished = $false
          } elseif ($null -ne $stable) {
            $stableDate = [DateTimeOffset]$stable.published_at
            $selected = $publishedReleases |
              Where-Object {
                $_.prerelease -and
                ([DateTimeOffset]$_.published_at) -gt $stableDate
              } |
              Select-Object -First 1

            if ($null -eq $selected) {
              $selected = $stable
              $alreadyPublished = $true
            } else {
              $alreadyPublished = Test-TargetReleaseExists $selected.tag_name
            }
          } else {
            $selected = $latestPrerelease
            $alreadyPublished = Test-TargetReleaseExists $selected.tag_name
          }

          if ($selected.tag_name -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$') {
            throw "The selected llama.cpp release has an invalid tag."
          }

          "tag=$($selected.tag_name)" >> $env:GITHUB_OUTPUT
          "prerelease=$($selected.prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "exists=$($alreadyPublished.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($alreadyPublished) {
            Write-Host "Release $($selected.tag_name) is already published; skipping."
          } else {
            Write-Host "Selected upstream release $($selected.tag_name) (prerelease: $($selected.prerelease))."
          }
      - name: Check out upstream release sources
        if: steps.upstream.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ steps.upstream.outputs.tag }}
          path: llama.cpp
          persist-credentials: false

      - name: Patch cpp-httplib for Windows 7
        if: steps.upstream.outputs.exists != 'true'
        shell: pwsh
        run: |
          $headerPath = "llama.cpp\vendor\cpp-httplib\httplib.h"
          $sourcePath = "llama.cpp\vendor\cpp-httplib\httplib.cpp"
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          $header = [System.IO.File]::ReadAllText($headerPath).Replace("`r`n", "`n")
          $source = [System.IO.File]::ReadAllText($sourcePath).Replace("`r`n", "`n")

          $versionGuard = '(?m)^#ifdef _WIN32\n#if defined\(_WIN32_WINNT\) && _WIN32_WINNT < 0x0A00\n#error[ \t]*\\\n[ \t]*"cpp-httplib doesn''t support Windows 8 or lower\. Please use Windows 10 or later\."\n#endif\n#endif\n?'
          if ([regex]::Matches($header, $versionGuard).Count -ne 1) {
            throw "Could not uniquely locate cpp-httplib's Windows 10 minimum-version guard."
          }
          $header = [regex]::Replace($header, $versionGuard, "")

          function Replace-ExactlyOnce {
            param(
              [string]$Text,
              [string]$Pattern,
              [string]$Replacement,
              [string]$Description
            )

            $count = [regex]::Matches($Text, $Pattern).Count
            if ($count -ne 1) {
              throw "Expected one $Description in cpp-httplib, found $count."
            }
            return [regex]::Replace($Text, $Pattern, $Replacement)
          }

          $source = Replace-ExactlyOnce $source `
            '(?m)^(\s*)::CreateFile2\(wpath\.c_str\(\),\s*GENERIC_READ,\s*FILE_SHARE_READ\s*\|\s*FILE_SHARE_WRITE,\s*OPEN_EXISTING,\s*NULL\);' `
            '${1}::CreateFileW(wpath.c_str(), GENERIC_READ, FILE_SHARE_READ | FILE_SHARE_WRITE, NULL, OPEN_EXISTING, FILE_ATTRIBUTE_NORMAL, NULL);' `
            "CreateFile2 call"

          $mappingReplacement = '${1}::CreateFileMappingW(hFile_, NULL, PAGE_READONLY,' +
            "`n" + '${1}                     static_cast<DWORD>(size_ >> 32),' +
            "`n" + '${1}                     static_cast<DWORD>(size_ & 0xFFFFFFFF), NULL);'
          $source = Replace-ExactlyOnce $source `
            '(?m)^(\s*)::CreateFileMappingFromApp\(hFile_,\s*NULL,\s*PAGE_READONLY,\s*size_,\s*NULL\);' `
            $mappingReplacement `
            "CreateFileMappingFromApp call"

          $source = Replace-ExactlyOnce $source `
            '(?m)^(\s*)addr_ = ::MapViewOfFileFromApp\(hMapping_,\s*FILE_MAP_READ,\s*0,\s*0\);' `
            '${1}addr_ = ::MapViewOfFile(hMapping_, FILE_MAP_READ, 0, 0, 0);' `
            "MapViewOfFileFromApp call"

          if ($header -match 'cpp-httplib doesn''t support Windows 8 or lower' -or
              $source -match 'CreateFile2|CreateFileMappingFromApp|MapViewOfFileFromApp') {
            throw "The cpp-httplib Windows 7 compatibility patch was incomplete."
          }

          [System.IO.File]::WriteAllText($headerPath, $header, $utf8NoBom)
          [System.IO.File]::WriteAllText($sourcePath, $source, $utf8NoBom)

      - name: Install portable w64devkit
        if: steps.upstream.outputs.exists != 'true'
        shell: pwsh
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/skeeto/w64devkit/releases/latest" `
            -Headers $headers
          $asset = $release.assets |
            Where-Object { $_.name -match '^w64devkit-x64-.*\.7z\.exe$' } |
            Select-Object -First 1

          if ($null -eq $asset) {
            throw "No x64 self-extracting w64devkit archive was found."
          }

          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          $kitRoot = Join-Path $env:RUNNER_TEMP "w64devkit"
          $downloaded = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Invoke-WebRequest `
                -Uri $asset.browser_download_url `
                -OutFile $archive `
                -TimeoutSec 120 `
                -ErrorAction Stop | Out-Null

              $actualDigest = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($asset.digest -and $asset.digest -ne "sha256:$actualDigest") {
                throw "Downloaded w64devkit archive did not match the release SHA-256 digest."
              }

              $signature = [System.IO.File]::ReadAllBytes($archive)
              if ($signature.Length -lt 2 -or $signature[0] -ne 0x4D -or $signature[1] -ne 0x5A) {
                throw "Downloaded w64devkit asset is not a Windows self-extracting archive."
              }

              $downloaded = $true
              break
            }
            catch {
              Remove-Item -Path $archive -Force -ErrorAction SilentlyContinue
              if ($attempt -eq 5) {
                throw "Failed to download and verify w64devkit after $attempt attempts: $($_.Exception.Message)"
              }

              $delay = [Math]::Min(30, [Math]::Pow(2, $attempt))
              Write-Warning "w64devkit download attempt $attempt failed. Retrying in $delay seconds."
              Start-Sleep -Seconds $delay
            }
          }
          if (-not $downloaded) {
            throw "Failed to download w64devkit."
          }

          $sevenZipCommand = Get-Command 7z.exe -ErrorAction SilentlyContinue
          if ($null -ne $sevenZipCommand) {
            $sevenZipPath = $sevenZipCommand.Source
          } else {
            $sevenZipPath = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          }
          if (-not (Test-Path $sevenZipPath)) {
            throw "7z.exe was not found on the Windows runner."
          }

          & $sevenZipPath x $archive "-o$kitRoot" -y
          $extractExitCode = $LASTEXITCODE
          if ($null -eq $extractExitCode -or $extractExitCode -ne 0) {
            throw "w64devkit extraction failed with exit code $extractExitCode."
          }

          $gcc = Get-ChildItem -Path $kitRoot -Filter gcc.exe -Recurse |
            Select-Object -First 1
          if ($null -eq $gcc) {
            throw "gcc.exe was not found in the extracted w64devkit archive."
          }

          $bin = $gcc.Directory.FullName
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          "W64DEVKIT_BIN=$bin" >> $env:GITHUB_ENV

      - name: Configure Win7 CPU build
        if: steps.upstream.outputs.exists != 'true'
        shell: pwsh
        run: |
          $win7Flags = "-D_WIN32_WINNT=0x0601 -DWINVER=0x0601"
          cmake -S llama.cpp -B build -G Ninja `
            "-DCMAKE_C_COMPILER=$env:W64DEVKIT_BIN\gcc.exe" `
            "-DCMAKE_CXX_COMPILER=$env:W64DEVKIT_BIN\g++.exe" `
            -DCMAKE_BUILD_TYPE=Release `
            -DLLAMA_BUILD_IS_DEV=OFF `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_TOOLS=ON `
            -DLLAMA_OPENSSL=OFF `
            -DBUILD_SHARED_LIBS=OFF `
            -DGGML_NATIVE=OFF `
            -DGGML_OPENMP=OFF `
            "-DCMAKE_C_FLAGS=$win7Flags" `
            "-DCMAKE_CXX_FLAGS=$win7Flags" `
            "-DCMAKE_EXE_LINKER_FLAGS=-static -static-libgcc -static-libstdc++"
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed with exit code $LASTEXITCODE."
          }

      - name: Build llama.cpp
        if: steps.upstream.outputs.exists != 'true'
        shell: pwsh
        run: |
          cmake --build build --parallel 2
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed with exit code $LASTEXITCODE."
          }

      - name: Package portable Win7 ZIP
        if: steps.upstream.outputs.exists != 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          $dist = Join-Path $env:RUNNER_TEMP "llama-win7"
          New-Item -ItemType Directory -Path $dist | Out-Null

          $executables = Get-ChildItem -Path "build\bin" -File |
            Where-Object { $_.Extension -in @(".exe", ".dll") }
          if (-not ($executables | Where-Object { $_.Name -eq "llama-cli.exe" })) {
            throw "llama-cli.exe was not produced."
          }
          if (-not ($executables | Where-Object { $_.Name -eq "llama-server.exe" })) {
            throw "llama-server.exe was not produced."
          }
          $executables | Copy-Item -Destination $dist

          $readme = @"
          llama.cpp $env:RELEASE_TAG - Windows 7 x64 (CPU)

          This portable build targets Windows 7 using MinGW-w64/w64devkit.
          On Windows 7, pass --no-mmap when running inference:

            llama-cli.exe -m model.gguf --no-mmap -p "Hello"
            llama-server.exe -m model.gguf --no-mmap

          This package contains the built executables and required runtime DLLs,
          if any. It does not include model files.
          "@
          Set-Content -Path (Join-Path $dist "README.txt") -Value $readme -Encoding utf8
          Copy-Item -Path "llama.cpp\LICENSE" -Destination $dist

          $zip = "llama.cpp-$env:RELEASE_TAG-win7-x64.zip"
          Compress-Archive -Path "$dist\*" -DestinationPath $zip -CompressionLevel Optimal

      - name: Verify Win7 API imports
        if: steps.upstream.outputs.exists != 'true'
        shell: pwsh
        run: |
          $executables = Get-ChildItem -Path "build\bin" -Filter "*.exe" -File
          foreach ($executable in $executables) {
            $imports = & "$env:W64DEVKIT_BIN\objdump.exe" -p $executable.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Could not inspect imports in $($executable.Name)."
            }

            $unsupported = $imports | Select-String `
              -Pattern '\b(CreateFile2|CreateFileMappingFromApp|MapViewOfFileFromApp|SetThreadDescription)\b'
            if ($unsupported) {
              throw "$($executable.Name) imports APIs unavailable on Windows 7: $unsupported"
            }
          }

      - name: Install Vulkan SDK
        if: steps.upstream.outputs.exists != 'true'
        id: vulkan-sdk
        continue-on-error: true
        shell: pwsh
        run: |
          $winget = Get-Command winget.exe -ErrorAction SilentlyContinue
          if ($null -eq $winget) {
            throw "winget.exe is not available on the Windows runner."
          }

          & $winget.Source install `
            --id KhronosGroup.VulkanSDK `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "Vulkan SDK installation failed with exit code $LASTEXITCODE."
          }

          $sdk = Get-ChildItem -Path "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if ($null -eq $sdk) {
            throw "Vulkan SDK installation completed, but C:\VulkanSDK contains no SDK."
          }
          if (-not (Test-Path (Join-Path $sdk.FullName "Bin\glslc.exe"))) {
            throw "glslc.exe was not found in Vulkan SDK $($sdk.FullName)."
          }

          "VULKAN_SDK=$($sdk.FullName)" >> $env:GITHUB_ENV
          "vulkan_sdk=$($sdk.FullName)" >> $env:GITHUB_OUTPUT

      - name: Configure optional Win7 Vulkan build
        if: steps.upstream.outputs.exists != 'true' && steps.vulkan-sdk.outcome == 'success'
        id: vulkan-configure
        continue-on-error: true
        shell: pwsh
        run: |
          $win7Flags = "-D_WIN32_WINNT=0x0601 -DWINVER=0x0601"
          cmake -S llama.cpp -B build-vulkan -G Ninja `
            "-DCMAKE_C_COMPILER=$env:W64DEVKIT_BIN\gcc.exe" `
            "-DCMAKE_CXX_COMPILER=$env:W64DEVKIT_BIN\g++.exe" `
            -DCMAKE_BUILD_TYPE=Release `
            -DLLAMA_BUILD_IS_DEV=OFF `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_TOOLS=ON `
            -DLLAMA_OPENSSL=OFF `
            -DBUILD_SHARED_LIBS=OFF `
            -DGGML_NATIVE=OFF `
            -DGGML_OPENMP=OFF `
            -DGGML_VULKAN=ON `
            "-DCMAKE_C_FLAGS=$win7Flags" `
            "-DCMAKE_CXX_FLAGS=$win7Flags" `
            "-DCMAKE_EXE_LINKER_FLAGS=-static -static-libgcc -static-libstdc++"
          if ($LASTEXITCODE -ne 0) {
            throw "Vulkan CMake configuration failed with exit code $LASTEXITCODE."
          }

      - name: Build optional Win7 Vulkan version
        if: steps.vulkan-configure.outcome == 'success'
        id: vulkan-build
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --build build-vulkan --parallel 2
          if ($LASTEXITCODE -ne 0) {
            throw "Vulkan build failed with exit code $LASTEXITCODE."
          }

      - name: Verify Win7 API imports in Vulkan build
        if: steps.vulkan-build.outcome == 'success'
        id: vulkan-verify
        continue-on-error: true
        shell: pwsh
        run: |
          $executables = Get-ChildItem -Path "build-vulkan\bin" -Filter "*.exe" -File
          foreach ($executable in $executables) {
            $imports = & "$env:W64DEVKIT_BIN\objdump.exe" -p $executable.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Could not inspect imports in Vulkan executable $($executable.Name)."
            }

            $unsupported = $imports | Select-String `
              -Pattern '\b(CreateFile2|CreateFileMappingFromApp|MapViewOfFileFromApp|SetThreadDescription)\b'
            if ($unsupported) {
              throw "$($executable.Name) imports APIs unavailable on Windows 7: $unsupported"
            }
          }

      - name: Package optional Win7 Vulkan ZIP
        if: steps.vulkan-verify.outcome == 'success'
        id: package-vulkan
        continue-on-error: true
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          $dist = Join-Path $env:RUNNER_TEMP "llama-win7-vulkan"
          New-Item -ItemType Directory -Path $dist | Out-Null

          $executables = Get-ChildItem -Path "build-vulkan\bin" -File |
            Where-Object { $_.Extension -in @(".exe", ".dll") }
          if (-not ($executables | Where-Object { $_.Name -eq "llama-cli.exe" })) {
            throw "Vulkan build did not produce llama-cli.exe."
          }
          if (-not ($executables | Where-Object { $_.Name -eq "llama-server.exe" })) {
            throw "Vulkan build did not produce llama-server.exe."
          }
          $executables | Copy-Item -Destination $dist

          $readme = @"
          llama.cpp $env:RELEASE_TAG - Windows 7 x64 (Vulkan)

          This build includes the Vulkan backend. A Windows 7-compatible Vulkan
          driver and Vulkan runtime must be installed for your graphics card.
          On Windows 7, pass --no-mmap when running inference:

            llama-cli.exe -m model.gguf --no-mmap -ngl 99 -p "Hello"
            llama-server.exe -m model.gguf --no-mmap -ngl 99

          This package does not include model files or a Vulkan driver.
          "@
          Set-Content -Path (Join-Path $dist "README.txt") -Value $readme -Encoding utf8
          Copy-Item -Path "llama.cpp\LICENSE" -Destination $dist

          $zip = "llama.cpp-$env:RELEASE_TAG-win7-x64-vulkan.zip"
          Compress-Archive -Path "$dist\*" -DestinationPath $zip -CompressionLevel Optimal

      - name: Publish release
        if: steps.upstream.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.upstream.outputs.tag }}
          name: llama.cpp ${{ steps.upstream.outputs.tag }} (Windows 7)
          prerelease: ${{ steps.upstream.outputs.prerelease == 'true' }}
          body: |
            Portable x64 CPU build of upstream llama.cpp ${{ steps.upstream.outputs.tag }} for Windows 7.

            Run `llama-cli.exe` or `llama-server.exe` with `--no-mmap` on Windows 7.
            ${{ steps.upstream.outputs.prerelease == 'true' && 'This build follows an upstream prerelease.' || '' }}
            A separate Vulkan archive is included when its optional build succeeds.
          files: llama.cpp-${{ steps.upstream.outputs.tag }}-win7-x64.zip
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Attach optional Vulkan ZIP
        if: steps.upstream.outputs.exists != 'true' && steps.package-vulkan.outcome == 'success'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.upstream.outputs.tag }}
          prerelease: ${{ steps.upstream.outputs.prerelease == 'true' }}
          files: llama.cpp-${{ steps.upstream.outputs.tag }}-win7-x64-vulkan.zip
          fail_on_unmatched_files: true
          overwrite_files: true
